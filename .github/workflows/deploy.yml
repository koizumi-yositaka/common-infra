name: Deploy CDK Stack

on:
  push:
    branches:
      - dev
      - main
  pull_request:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: prod
    env:
      AWS_ACCOUNT: 260337063361
      AWS_REGION: us-east-1
      DOMAIN: yositaka-test.com
      ALLOWED_ORIGINS: http://localhost:5555,http://localhost:5500,https://d3bgyx72paaick.cloudfront.net,https://dj1c2up9ql1s6.cloudfront.net,https://quiz-distributor.dev.yositaka-test.com,https://manage-work.dev.yositaka-test.com
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "22"
      - name: Install CDK app deps
        run: |
          npm ci
          
      - name: Build Lambdas
        run: |
          cd lambdas/mwLogin && npm install && npm run build && cd ../..
          cd lambdas/mwGetUser && npm install && npm run build && cd ../..
          cd lambdas/invalidateCloudFrontCache && npm install && npm run build && cd ../..

      - name: Set STAGE
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            if [[ "${{ github.base_ref }}" == "main" ]]; then
              echo "STAGE=prod" >> $GITHUB_ENV
            else
              echo "STAGE=dev" >> $GITHUB_ENV
            fi
          else
            # push イベントなら ref_name から直接取得（main→prod / dev→dev）
            if [[ "${{ github.ref_name }}" == "main" ]]; then
              echo "STAGE=prod" >> $GITHUB_ENV
            else
              echo "STAGE=dev" >> $GITHUB_ENV
            fi
          fi
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: CDK Diff
        if: github.event_name == 'pull_request'
        run: |
          echo "STAGE: $STAGE"
          npx aws-cdk diff --all || true
      - name: CDK Deploy
        if: github.event_name == 'push'
        id: deploy
        run: |
          echo "STAGE: $STAGE"
          npx aws-cdk deploy --all --require-approval never --outputs-file cdk-outputs.json

      - name: Show CDK Outputs
        if: github.event_name == 'push'
        run: cat cdk-outputs.json

      - name: Notify Teams
        if: github.event_name == 'push'
        run: |
          URL1=$(jq -r '.devReactDistributeBucket.HostingURL' cdk-outputs.json)
          URL2=$(jq -r '.devManageWorkReactDistributeBucket.HostingURL' cdk-outputs.json)

          DISTRIBUTION_ID1=$(jq -r '.devReactDistributeBucket.DistributionID' cdk-outputs.json)
          DISTRIBUTION_ID2=$(jq -r '.devManageWorkReactDistributeBucket.DistributionID' cdk-outputs.json)

          echo "ReactDistribute: $URL1"
          echo "ManageWorkReactDistribute: $URL2"

          echo "ReactDistribute DistributionID: $DISTRIBUTION_ID1"
          echo "ManageWorkReactDistribute DistributionID: $DISTRIBUTION_ID2"

          curl -H 'Content-Type: application/json' \
               -d "{
                     \"@type\": \"MessageCard\",
                     \"@context\": \"https://schema.org/extensions\",
                     \"summary\": \"CDK Deploy Result\",
                     \"themeColor\": \"0076D7\",
                     \"title\": \"✅ CDK デプロイ完了\",
                     \"sections\": [{
                       \"activityTitle\": \"ステージ: $STAGE\",
                       \"facts\": [
                         {\"name\": \"React Distribute\", \"value\": \"$URL1\"},
                         {\"name\": \"React Distribute DistributionID\", \"value\": \"$DISTRIBUTION_ID1\"},
                         {\"name\": \"Manage Work React Distribute\", \"value\": \"$URL2\"},
                         {\"name\": \"Manage Work React Distribute DistributionID\", \"value\": \"$DISTRIBUTION_ID2\"}
                       ],
                       \"markdown\": true
                     }]
                   }" \
               ${{ secrets.TEAMS_WEBHOOK_URL }}